<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Profile</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header text-center">
                <h2>Voter Profile</h2>
            </div>
            <div class="card-body">
                <div class="row" id="user-profile">
                    <div class="col-md-6">
                        <p><strong>Name:</strong> <span id="name"></span></p>
                        <p><strong>Age:</strong> <span id="age"></span></p>
                        <p><strong>Email:</strong> <span id="email"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Mobile:</strong> <span id="mobile"></span></p>
                    <p><strong>Address:</strong> <span id="address"></span></p>
                    <p><strong>Aadhar Card Number:</strong> <span id="aadharCardNumber"></span></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Is Voted:</strong> <span id="isVoted"></span></p>
                    </div>
                </div>
            </div>
            <div class="card-footer text-center">
                <button class="btn btn-danger" id="logout">Logout</button>
                <button class="btn btn-danger" id="changePassword">Change Password</button>
                <button class="btn btn-danger"><a href="http://127.0.0.1:5500/Frontend/voting.html" style="color: #fff; text-decoration: none;">Vote</a> </button>
            </div>
        </div>
    </div>

    <script src="./profile.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
